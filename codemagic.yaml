# Codemagic: build iOS de Rutas Tampico (Capacitor 8, Swift Package Manager).
# Requisitos en Codemagic (Teams > Integrations / Environment variables):
#   1) Integración "App Store Connect" con API key llamada  <NOMBRE_DE_TU_API_KEY>  (ver docs/IOS.md)
#   2) (Opcional) Grupo de variables "app_store" si usas variables extra.
workflows:
  ios-capacitor:
    name: iOS Capacitor (App Store / TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: <NOMBRE_DE_TU_API_KEY>   # PLACEHOLDER: nombre de la integración en Codemagic
    environment:
      groups:
        - app_store                              # PLACEHOLDER: grupo de variables (puede quedar vacío)
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rutastampico.mafa
      vars:
        BUNDLE_ID: "com.rutastampico.mafa"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: 0000000000           # PLACEHOLDER: Apple ID numérico de la app en App Store Connect
      node: 22
      xcode: latest
    triggering:
      events: [push]
      branch_patterns:
        - pattern: ios-y-rutas-reales
        - pattern: main
    scripts:
      - name: Instalar dependencias
        script: npm ci
      - name: Build web (export estático a out/)
        script: npm run build
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Firma automática (perfiles desde App Store Connect)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Número de build
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          cd ios/App && agvtool new-version -all $((LATEST + 1))
      - name: Compilar .ipa
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - <TU_CORREO@ejemplo.com>              # PLACEHOLDER
